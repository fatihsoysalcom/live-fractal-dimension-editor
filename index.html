<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Fractal Dimension Editor</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            color: #eee;
            font-family: sans-serif;
        }
        canvas {
            border: 1px solid #333;
            cursor: grab;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
        .controls label, .controls input {
            display: block;
            margin-bottom: 5px;
        }
        .controls input[type="range"] {
            width: 150px;
        }
    </style>
</head>
<body>
    <canvas id="mandelbrotCanvas"></canvas>
    <div class="controls">
        <label for="maxIterations">Max Iterations:</label>
        <input type="range" id="maxIterations" min="50" max="1000" value="200">
        <p style="font-size: 0.8em; margin-top: 10px;">Zoom: mouse wheel<br>Pan: drag canvas</p>
    </div>

    <script>
        const canvas = document.getElementById('mandelbrotCanvas');
        const ctx = canvas.getContext('2d');
        const maxIterationsInput = document.getElementById('maxIterations');

        let width = window.innerWidth * 0.8;
        let height = window.innerHeight * 0.8;
        canvas.width = width;
        canvas.height = height;

        let minX = -2.5;
        let maxX = 1.5;
        let minY = -2;
        let maxY = 2;
        let maxIters = parseInt(maxIterationsInput.value);

        // Mandelbrot calculation function
        function mandelbrot(cx, cy, maxIterations) {
            let x = 0.0;
            let y = 0.0;
            let i = 0;
            while (x * x + y * y < 4 && i < maxIterations) {
                let xtemp = x * x - y * y + cx;
                y = 2 * x * y + cy;
                x = xtemp;
                i++;
            }
            return i;
        }

        // Simple color mapping for points outside the set
        function getColor(iterations, maxIterations) {
            if (iterations === maxIterations) {
                return [0, 0, 0]; // Black for points inside the set
            }
            // Generates a simple gradient based on iteration count
            const r = (iterations * 5) % 255;
            const g = (iterations * 7) % 255;
            const b = (iterations * 11) % 255;
            return [r, g, b];
        }

        // Main drawing function
        function drawMandelbrot() {
            maxIters = parseInt(maxIterationsInput.value); // Get current max iterations
            const imageData = ctx.createImageData(width, height);
            const data = imageData.data;

            // This loop represents the "live" rendering aspect.
            // Changes to view or iterations are immediately reflected,
            // simulating a responsive holographic editor.
            for (let py = 0; py < height; py++) {
                for (let px = 0; px < width; px++) {
                    const cx = minX + (px / width) * (maxX - minX);
                    const cy = minY + (py / height) * (maxY - minY);

                    const iterations = mandelbrot(cx, cy, maxIters);
                    const color = getColor(iterations, maxIters); // Returns [R, G, B]

                    const index = (py * width + px) * 4;
                    data[index] = color[0];     // Red
                    data[index + 1] = color[1]; // Green
                    data[index + 2] = color[2]; // Blue
                    data[index + 3] = 255;      // Alpha
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // --- Interaction Handlers ---
        let isDragging = false;
        let startDragX, startDragY;
        let dragMinX, dragMaxX, dragMinY, dragMaxY;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            canvas.style.cursor = 'grabbing';
            startDragX = e.clientX;
            startDragY = e.clientY;
            dragMinX = minX;
            dragMaxX = maxX;
            dragMinY = minY;
            dragMaxY = maxY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startDragX;
            const dy = e.clientY - startDragY;

            const rangeX = dragMaxX - dragMinX;
            const rangeY = dragMaxY - dragMinY;

            minX = dragMinX - (dx / width) * rangeX;
            maxX = dragMaxX - (dx / width) * rangeX;
            minY = dragMinY - (dy / height) * rangeY;
            maxY = dragMaxY - (dy / height) * rangeY;
            drawMandelbrot(); // Live update during drag
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            canvas.style.cursor = 'grab';
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            const mouseX = e.clientX - canvas.getBoundingClientRect().left;
            const mouseY = e.clientY - canvas.getBoundingClientRect().top;

            const complexX = minX + (mouseX / width) * (maxX - minX);
            const complexY = minY + (mouseY / height) * (maxY - minY);

            if (e.deltaY < 0) { // Zoom in
                minX = complexX - (complexX - minX) / zoomFactor;
                maxX = complexX + (maxX - complexX) / zoomFactor;
                minY = complexY - (complexY - minY) / zoomFactor;
                maxY = complexY + (maxY - complexY) / zoomFactor;
            } else { // Zoom out
                minX = complexX - (complexX - minX) * zoomFactor;
                maxX = complexX + (maxX - complexX) * zoomFactor;
                minY = complexY - (complexY - minY) * zoomFactor;
                maxY = complexY + (maxY - complexY) * zoomFactor;
            }
            drawMandelbrot(); // Live update on zoom
        });

        // Adjusting max iterations simulates exploring "Fractal Time"
        // by revealing deeper layers of detail over an iterative process.
        maxIterationsInput.addEventListener('input', drawMandelbrot); // Live update on iteration change

        // Initial draw
        drawMandelbrot();

        // Resize handler to keep canvas responsive
        window.addEventListener('resize', () => {
            width = window.innerWidth * 0.8;
            height = window.innerHeight * 0.8;
            canvas.width = width;
            canvas.height = height;
            drawMandelbrot();
        });
    </script>
</body>
</html>
